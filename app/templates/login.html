<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - SAS Drive Rig Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-cyan-400 mb-2">Sign In</h2>
        <p class="text-xs text-slate-400 mb-6">Enter credentials to access the SAS Drive Rig.</p>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm">
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 rounded text-sm">Login</button>
        </form>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})
            }).then(res => {
                if (res.ok) window.location.href = '/';
                else alert('Invalid credentials.');
            });
        }
    </script>
</body>
</html>
